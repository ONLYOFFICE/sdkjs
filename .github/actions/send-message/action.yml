name: 'Send message to telegram'
description: 'Send message to telegram'
inputs:
  token:
    required: true
  chat:
    required: true
  message:
    required: false
    default: |
      Workflow: ${{ github.workflow }}
      Github job: ${{ github.job }}
      Github job status: '❌' - ${{ job.status }}
      Branch: ${{ github.ref_name }}
      Commit: [__COMMIT_SUBJECT__](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

      See action run logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
runs:
  using: "composite"
  steps:
    - name: Send message to telegram
      shell: bash
      env:
        MESSAGE: ${{ inputs.message }}
        TELEGRAM_TOKEN: ${{ inputs.token }}
        TELEGRAM_CHAT: ${{ inputs.chat }}
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        # Replace the commit-subject placeholder with the first line of the commit
        # message (brackets -> parens, strip Markdown specials so the link can't break).
        COMMIT_SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n1 | tr -d '`*_' | tr '[]' '()')
        [ -z "$COMMIT_SUBJECT" ] && COMMIT_SUBJECT="${COMMIT_SHA:0:7}"
        MESSAGE="${MESSAGE/__COMMIT_SUBJECT__/$COMMIT_SUBJECT}"

        PAYLOAD=$(jq -n \
          --arg chat_id "$TELEGRAM_CHAT" \
          --arg text "$MESSAGE" \
          '{
            chat_id: $chat_id,
            text: $text,
            parse_mode: "Markdown",
            disable_notification: true,
            disable_web_page_preview: true
          }')
        
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD"
