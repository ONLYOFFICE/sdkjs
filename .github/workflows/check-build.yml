name: Check sdkjs
on:
  push:
    branches:
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - 'release/**'
      - 'hotfix/**'
jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@v3

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: execute check styles
        run: python tests/code-style/check.py

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libatk1.0-0 libcups2 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libnss3 libgbm1 libasound2t64

      - name: check out repository
        uses: actions/checkout@v4

      - name: Check out sdkjs-tests (matching branch)
        id: sdkjs-tests-branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ONLYOFFICE/sdkjs-tests
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-tests
          ref: ${{ github.base_ref || github.ref_name }}
          
      - name: Check out sdkjs-tests (master fallback)
        if: steps.sdkjs-tests-branch.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/sdkjs-tests
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-tests
          ref: master

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
            node-version: 20

      - name: Run unit tests
        run: |
          python build/build.py --develop
          node tests/run.js

      - name: Send message to telegram if failure
        if: failure()
        uses: ./.github/actions/send-message
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: ${{ secrets.TELEGRAM_TO }}

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@v4
        with:
          path: sdkjs

      - name: check out repository sdkjs-forms current branch
        id: sdkjs-forms
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ONLYOFFICE/sdkjs-forms
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-forms
          ref: ${{ github.ref }}
      - name: check out repository sdkjs-forms master branch
        if: steps.sdkjs-forms.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/sdkjs-forms
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-forms
          ref: master

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run build sdkjs
        run: |
          cd sdkjs
          npm install grunt-cli
          npm install --prefix build
          node node_modules/grunt-cli/bin/grunt --gruntfile build/Gruntfile.js

      - name: Send message to telegram if failure
        if: failure()
        uses: ./sdkjs/.github/actions/send-message
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: ${{ secrets.TELEGRAM_TO }}
