name: Check sdkjs
on:
  push:
    branches:
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - 'release/**'
      - 'hotfix/**'
jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@v4
        with:
          path: sdkjs

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Check out sdkjs-tests (matching branch)
        id: sdkjs-tests-branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ONLYOFFICE/sdkjs-tests
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-tests
          ref: ${{ github.base_ref || github.ref_name }}
          
      - name: Check out sdkjs-tests (master fallback)
        if: steps.sdkjs-tests-branch.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/sdkjs-tests
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-tests
          ref: master
      
      - name: execute check styles
        run: |
          cd sdkjs
          python ../sdkjs-tests/code-style/check.py

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libatk1.0-0 libcups2 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libnss3 libgbm1 libasound2t64

      - name: check out repository
        uses: actions/checkout@v4
        with:
          path: sdkjs

      - name: Check out sdkjs-tests (matching branch)
        id: sdkjs-tests-branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ONLYOFFICE/sdkjs-tests
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-tests
          ref: ${{ github.base_ref || github.ref_name }}
          
      - name: Check out sdkjs-tests (master fallback)
        if: steps.sdkjs-tests-branch.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/sdkjs-tests
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-tests
          ref: master

      - name: Check out sdkjs-ext (matching branch)
        id: sdkjs-ext-branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ONLYOFFICE/sdkjs-ext
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-ext
          ref: ${{ github.base_ref || github.ref_name }}

      - name: Check out sdkjs-ext (master fallback)
        if: steps.sdkjs-ext-branch.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/sdkjs-ext
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-ext
          ref: master

      - name: Check out sdkjs-forms (matching branch)
        id: sdkjs-forms-branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ONLYOFFICE/sdkjs-forms
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-forms
          ref: ${{ github.base_ref || github.ref_name }}

      - name: Check out sdkjs-forms (master fallback)
        if: steps.sdkjs-forms-branch.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/sdkjs-forms
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-forms
          ref: master

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
            node-version: 20

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          cd sdkjs
          python build/build.py --develop --addon ../sdkjs-ext --addon ../sdkjs-forms
          cd ../sdkjs-tests
          npm install node-qunit-puppeteer
          node run.js 2>&1 | tee "$GITHUB_WORKSPACE/test-output.txt"

      - name: Send message to telegram if failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_TO }}
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}"
          AUTHOR="${{ github.actor }}"
          NOW=$(date -u "+%Y-%m-%d %H:%M UTC")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          FAILED_MODULES=$(sed 's/\x1b\[[0-9;]*m//g' "$GITHUB_WORKSPACE/test-output.txt" | \
            awk '/^FAILED$/{f=1; next} f && /\.html$/{print}' | \
            sed "s|$GITHUB_WORKSPACE/sdkjs-tests/||")

          [ -z "$FAILED_MODULES" ] && FAILED_MODULES="(see logs for details)"

          MESSAGE=$'❌ Unit tests failed\n\nBranch: '"$BRANCH"$'\nAuthor: ['"$AUTHOR"'](https://github.com/'"$AUTHOR"$')\nTime: '"$NOW"$'\n\nFailed modules:\n```\n'"$FAILED_MODULES"$'\n```\n\nLogs: '"$RUN_URL"

          PAYLOAD=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT" \
            --arg text "$MESSAGE" \
            '{"chat_id":$chat_id,"text":$text,"parse_mode":"Markdown","disable_notification":true,"disable_web_page_preview":true}')

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@v4
        with:
          path: sdkjs

      - name: check out repository sdkjs-forms current branch
        id: sdkjs-forms
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ONLYOFFICE/sdkjs-forms
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-forms
          ref: ${{ github.base_ref || github.ref_name }}
      - name: check out repository sdkjs-forms master branch
        if: steps.sdkjs-forms.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/sdkjs-forms
          token: ${{ secrets.READ_PAT }}
          path: sdkjs-forms
          ref: master

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run build sdkjs
        run: |
          cd sdkjs
          python build/build.py --addon ../sdkjs-forms

      - name: Send message to telegram if failure
        if: failure()
        uses: ./sdkjs/.github/actions/send-message
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: ${{ secrets.TELEGRAM_TO }}
